function home(v){return {body:'<div class="hg-spacer"></div><span class="hg-kicker">Heroes III · Goonks & Magic</span><h1>Ton royaume<br>t’attend.</h1><p class="hg-subtle">Reprends ta conquête ou prépare une nouvelle aventure.</p>'+card('Dernière partie','<h2>Sylvia · Trésors de WoG</h2><small>Jour 4 · semaine 2 · mois 1</small>')+btn('Nouvelle aventure','tonal','setup')+btn('Multijoueur','secondary','online')+'<div class="hg-spacer"></div>',primary:'Reprendre',more:['Campagnes','Charger une partie','Paramètres']};}

function misc(v,id){if(id==='resources'||id==='game-calendar')return {body:resources()+row('Prochain recrutement','Dans 7 jours')+row('Date','Jour 1 · semaine 2 · mois 1')+row('Revenus quotidiens','',cost(4500)),primary:'Voir les recrues',more:['Liste des villes']};if(id==='material-select')return {body:field('Faction','Goonks',['Aléatoire','Château','Rempart','Tour','Inferno','Nécropole','Donjon','Bastion','Forteresse','Conflux','Goonks'])+(/Ouvert|Clavier/.test(v)?'<div class="hg-stack" role="listbox" aria-label="Factions">'+['Aléatoire','Château','Goonks'].map((n,i)=>btn(n,'quiet','choice','role="option" aria-selected="'+(i===2)+'"')).join(''):'')+(/Désactivé/.test(v)?alert('Ce choix est fixé par la carte.'):''),primary:'Choisir',more:[],disabled:/Désactivé/.test(v)};if(id==='weekly-recruits')return {body:row('Goonkbourg','Citadelle · 14 recrues')+row('Château de Sylvia','Fort · 8 recrues')+row('Portail d’invocation','Verrouillé')+card('Prochaine semaine','<p>Renouvellement dans 7 jours.</p>'),primary:'Ouvrir le recrutement',more:[]};if(id==='scenario-details')return {body:'<img src="'+ASSETS.map+'" alt="Carte d’aventure" style="width:100%;height:144px">'+row('Taille','XL · deux niveaux')+row('Joueurs','2 humains · 2 ordinateurs')+row('Objectif','Capturer tous les châteaux')+row('Défaite','Perdre Sylvia')+desc(),primary:'Choisir cette carte',more:[]};if(id==='mithril-enhancements')return {body:'<div class="hg-line"><h2>Mithril disponible</h2><strong>999</strong></div>'+['Mine de cristal','Guilde des mages','Logement de créatures'].map((n,i)=>row(n,['Production doublée','Changer le sort proposé','Recrutement renforcé'][i],btn('100 Mi','secondary','confirm'))).join(''),primary:'Voir le site',more:[]};if(id==='hosted-castles')return setup('Choisir les châteaux');if(id==='campaign-media')return {body:'<img src="'+ASSETS.map+'" alt="Illustration de campagne" style="width:100%;height:220px"><h2>Retour au pays</h2><p>La reconquête du royaume commence.</p>',primary:'Cont  const closed=/fermé/.test(v),research=/Recherche/.test(v);

}
function model(screen,v,design){const id=screen.id;
switch(id){
case'mobile':if(/Combat|cibles|Inspection/.test(v))return battle(v);if(/Carte d’aventure/.test(v))return mapView();if(v==='Château')return buildings('Château',design);if(/Recrutement/.test(v))return recruit('hall',v,design);if(/Liste des héros/.test(v))return {body:['Sylvia','Marius','Solmyr'].map(n=>row(n,'1 500 PM · 20 mana',btn('Ouvrir','secondary','hero'))).join(''),primary:'Sélectionner le héros',more:[]};if(/Liste des villes/.test(v))return {body:['Goonkbourg','Château de Sylvia','Fort du Nord'].map(n=>row(n,'Revenus : 1 000 or',btn('Ouvrir','secondary','town'))).join(''),primary:'Ouvrir la ville',more:[]};if(/Préparer/.test(v))return setup(v);if(/Charger/.test(v))return recovery(v);if(/campagnes/.test(v))return campaigns(v);if(/Multijoueur/.test(v))return online(v,id);return home(v);
case'game-menu':if(v==='Menu')return menu();if(/nouvelle/.test(v))return {body:alert('La partie en cours sera quittée. La dernière sauvegarde reste disponible.',true),primary:'Nouvelle partie',secondary:'Sauvegarder',more:[]};if(/stockage/i.test(v))return storage(v,'storage-page');return settings(v);
case'hosted-match-create':if(/cartes/.test(v))return maps(v);if(/châteaux/.test(v))return setup(v);return online(v,id);
case'online-lobby':case'online-login':case'hosted-code-copy':return online(v,id);
case'lobby-choices':return /Cartes/.test(v)?maps(v):/Options/.test(v)?options(v):setup(v);
case'campaign-setup':return /Chargement/.test(v)?storage(v,'loading'):campaigns(v);
case'hero-equipment':return heroes(v);
case'hero-exchange':return /Artefacts/.test(v)?{body:tabs(['Sylvia','Orrin'])+'<div class="hg-equipment">'+['Épée','Bouclier','Bottes','Anneau','Grimoire','Bannière'].map(n=>btn(icon('gem')+'<span>'+n+'</span>','secondary','item')).join('')+'</div>'+alert('Sélectionne un objet, puis le héros destinataire.'),primary:'Confirmer l’échange',more:[]}:armyView(v);
case'creature-presentation':return /Évolutions/.test(v)?{body:evolution()+stats()+desc()+card('Amélioration de la troupe',cost(4200)),primary:'Demander le devis',more:[]}:recruit(/Détails/.test(v)?'detail':/château/.test(v)?'hall':'recruit',v,design);
case'town-services':return /voleurs/.test(v)?guild(v):{body:['Baliste','Tente de soins','Chariot de munitions'].map(n=>row(n,'Un emplacement d’équipement requis',cost(1000))).join('')+alert('La machine sera équipée sur le héros en visite.'),primary:'Acheter · 1 000 or',more:[]};
case'thieves-guild-view':return guild(v);

case'army-upgrades':return upgrades(v);
case'army-panel':return armyView(v);

case'mithril-enhancements':return misc(v,id);
case'dialog-presentation':return /Commandeur|commandeur/.test(v)?commander(v,id):message(v,id);
case'progression-choices':return {body:card(v==='Tour'?'Tour de progression':'Choisis une amélioration','<p>Le choix s’applique à la troupe sélectionnée.</p>')+(v==='Choix de famille'?['Attaque','Défense','Magie']:v==='Choix de progression'?['Attaque +2','Défense +2','Vitesse +1']:['Entrer dans la tour','Consulter les conditions']).map((n,i)=>radio(n,i===0,'progression')).join(''),primary:v==='Tour'?'Continuer':'Confirmer le choix',more:[]};
case'commander-tree':return {body:tabs(['Capacités','Spécialisation'],/Spécialisation/.test(v)?1:0)+'<div class="hg-grid">'+['Attaque','Défense','Puissance','Connaissance','Vitesse','Résistance','Expertise','Maîtrise'].map((n,i)=>btn(n+'<small>'+(i<4?'Expert · améliorable':'Maître requis')+'</small>','secondary','choice',i>5?'disabled':'')).join('')+'</div>'+alert('Choisis une capacité pour lire ses prérequis et ses effets.'),primary:/Choix/.test(v)?'Apprendre la capacité':'Voir les prérequis',more:[]};
case'henchman-sheet':return commander(v,id);
case'spellbook':return spellbook(v);

case'marketplace':return marketplace(v);

case'town-recruitment':case'recruitment-families':return recruit('hall',v,design);
case'weekly-recruits':return misc(v,id);
case'storage-page':case'boot-screen':case'loading':case'storage':return storage(v,id);
case'session-recovery':return recovery(v);
case'campaign-media':case'game-calendar':return misc(v,id);
case'hosted-turn-notifications':return notifications(v);
case'wog-options':case'lobby-options':return options(v);
case'scenario-filters':return maps(v);
case'hosted-castles':case'material-select':return misc(v,id);
case'campaign-dialog-form':return {body:card('Choix du scénario',/Illustration/.test(v)?'<img src="'+ASSETS.map+'" alt="Illustration de la récompense" style="height:160px;width:100%">':'<p>Ta réponse sera enregistrée dans cette campagne.</p>')+(/Choix/.test(v)?radio('Accepter la mission',true,'erm')+radio('Refuser',false,'erm'):field(/nombre/.test(v)?'Quantité':'Nom',/nombre/.test(v)?'3':'Sylvia')),primary:'Confirmer',more:[]};
case'battle-inspection':{const m=recruit('detail',v,design);m.body+=card('Sorts actifs',row('Bouclier de feu','2 tours restants · 12 mana'));m.primary=null;m.more=[];return m;}
case'battle-dual-view':case'battle-controls':case'battle-vertical':case'image-outline':return battle(v);
case'resources':return misc(v,id);
case'high-score-presentation':return message(v,id);
case'scenario-details':return misc(v,id);
case'recruitment-summary':return {body:'<div class="hg-line">'+art(0)+'<div><h2>Paingpaing</h2><small>Stock partagé · 14 disponibles</small></div></div>'+purchase(),primary:'Recruter '+state.qty,more:[]};

default:throw new Error('Missing prototype family: '+id);
}}
const outOfGame=new Set(['hosted-match-create','online-lobby','online-login','lobby-choices','campaign-setup','storage-page','session-recovery','boot-screen','loading','campaign-media','hosted-turn-notifications','wog-options','lobby-options','scenario-filters','hosted-castles','hosted-code-copy','material-select','scenario-details','hosting-index','storage']);
const screenSelect=root.querySelector('[data-gallery=screen]'),stateSelect=root.querySelector('[data-gallery=state]');
screenSelect.innerHTML=INVENTORY.map(s=>'<option value="'+s.id+'">'+labels[s.id]+'</option>').join('');
function save(){globalThis.openai?.setWidgetState?.({modelContent:{prototype:{screen:state.screen,state:INVENTORY.find(s=>s.id===state.screen)?.variants[state.variant],orientation:state.orientation,size:state.size,direction:root.querySelector('[data-variant]:not([hidden])')?.dataset.variant}},privateContent:{screen:state.screen,variant:state.variant,orientation:state.orientation,size:state.size}})?.catch(()=>{});}
function fit(){const landscape=state.orientation==='landscape',w=landscape?(state.size==='tight'?568:640):(state.size==='tight'?320:360),h=landscape?(state.size==='tight'?280:360):(state.size==='tight'?568:640);for(const device of root.querySelectorAll('.hg-device')){const stage=device.parentElement,scale=Math.min(1,((stage.clientWidth||root.clientWidth)-2)/w);device.style.width=w+'px';device.style.height=h+'px';device.style.transform='scale('+scale+')';stage.style.height=(h*scale+24)+'px';device.classList.toggle('landscape',landscape);}const scale=Math.min(1,(root.clientWidth-2)/w);root.querySelector('[data-dimensions]').textContent=w+' × '+h+' px'+(scale<.99?' · aperçu '+Math.round(scale*100)+' %':'');}
function render(){const screen=INVENTORY.find(s=>s.id===state.screen);state.variant=Math.min(state.variant,screen.variants.length-1);const v=screen.variants[state.variant];screenSelect.value=state.screen;stateSelect.innerHTML=screen.variants.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');stateSelect.value=String(state.variant);root.querySelector('[data-gallery=orientation]').value=state.orientation;root.querySelector('[data-gallery=size]').value=state.size;root.querySelector('[data-coverage]').textContent='56 familles · 175 états · '+labels[screen.id];for(const device of root.querySelectorAll('.hg-device')){const m=model(screen,v,device.dataset.design),showResources=!outOfGame.has(screen.id)&&!(screen.id==='mobile'&&['Accueil','Multijoueur','Préparer la partie','Charger une partie','Catalogue des campagnes'].includes(v)),title=m.title||shortTitles[screen.id]||labels[screen.id];device.innerHTML='<div class="hg-shell"><header class="hg-top"><div class="hg-title"><h1>'+title+'</h1>'+(state.orientation==='landscape'&&(m.more?.length||m.secondary)?btn(icon('ellipsis'),'quiet','menu','aria-label="Autres actions"'):'')+btn(icon('x'),'quiet','close','aria-label="Fermer cet écran"')+'</div>'+(showResources?resources():'')+'</header><main class="hg-content'+(m.scene?' scene':m.hall?' hall':m.guild?' guild':m.hero?' hero':m.armies?' armies':'')+'" aria-label="'+esc(v)+'">'+(m.note?alert(m.note):'')+m.body+'</main><footer class="hg-dock">'+(m.context?'<div class="hg-context">'+m.context+'</div>':'')+'<div class="hg-dock-actions">'+(m.secondary&&state.orientation!=='landscape'?btn(m.secondary,'secondary','secondary'):'')+(m.primary?btn(m.primary,'primary','confirm',m.disabled?'disabled':''):'')+(state.orientation!=='landscape'&&m.more?.length?btn(icon('ellipsis'),'quiet','menu','aria-label="Autres actions"'):'')+'</div></footer></div>'+(state.toast?'<div class="hg-toast" role="status">'+esc(state.toast)+'</div>':'');device.dataset.family=screen.id;device.dataset.variant=v;device.dataset.primary=m.primary||'';device._menu=[...(m.more||[]),...(m.secondary&&state.orientation==='landscape'?[m.secondary]:[])];}
fit();globalThis.lucide?.createIcons?.({attrs:{width:20,height:20}});}
function go(id,variant=0){state.history.push({screen:state.screen,variant:state.variant});state.screen=id;state.variant=variant;state.toast='';render();save();}
function toast(text){clearTimeout(toastTimer);state.toast=text;for(const d of root.querySelectorAll('.hg-device')){d.querySelector('.hg-toast')?.remove();d.querySelector('.hg-popover')?.remove();const n=document.createElement('div');n.className='hg-toast';n.setAttribute('role','status');n.textContent=text;d.append(n);}toastTimer=setTimeout(()=>{state.toast='';for(const n of root.querySelectorAll('.hg-toast'))n.remove();},2500);}
root.addEventListener('change',event=>{const g=event.target.dataset.gallery;if(g){if(g==='screen'){state.screen=event.target.value;state.variant=0;}else if(g==='state')state.variant=Number(event.target.value);else state[g]=event.target.value;render();save();}else if(event.target.matches('.hg-qty input')){state.qty=Math.max(1,Math.min(14,Number(event.target.value)||1));render();}else if(event.target.getAttribute('aria-label')==='Vue du héros'){state.variant=event.target.selectedIndex;render();}else if(event.target.getAttribute('aria-label')==='Rubrique'){state.settingsSection=event.target.value;render();}else if(event.target.getAttribute('aria-label')==='Évolution'){state.unit=event.target.selectedIndex;render();}else if(event.target.getAttribute('aria-label')==='Faction'){state.faction=event.target.value;render();}else if(event.target.getAttribute('aria-label')==='Renseignement'){state.metric=event.target.value;render();}});
root.addEventListener('click',event=>{const retain=event.target.closest('[data-gallery=retain]');if(retain){save();root.querySelector('[data-review]').textContent='Écran retenu : '+labels[state.screen]+' · '+INVENTORY.find(s=>s.id===state.screen).variants[state.variant];return;}const b=event.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='more'||a==='less'||a==='max'){state.qty=a==='max'?14:Math.min(14,Math.max(1,state.qty+(a==='more'?1:-1)));render();return;}if(a==='unit'){state.unit=Number(b.dataset.unit)||0;render();return;}if(a==='spell'){state.spell=Number(b.dataset.spell);render();return;}if(a==='tab'){for(const t of b.parentElement.querySelectorAll('[role=tab]'))t.setAttribute('aria-selected',String(t===b));const detail=b.closest('main').querySelector('.hg-card');if(detail)detail.querySelector('h2').textContent=b.textContent+' · sélection';return;}if(a==='menu'){const device=b.closest('.hg-device'),old=device.querySelector('.hg-popover');if(old){old.remove();return;}const pop=document.createElement('div');pop.className='hg-popover';pop.setAttribute('role','menu');pop.innerHTML=device._menu.map(n=>btn(n,'quiet','menuitem','role="menuitem"')).join('');device.append(pop);return;}const routes={setup:['lobby-choices',0],online:['online-lobby',0],hero:['hero-equipment',3],town:['town-portrait',0],book:['spellbook',0],upgrade:['army-upgrades',0],building:['town-building-menu',1],settings:['game-menu',1],audio:['game-menu',3],cheats:['game-menu',2],storage:['storage-page',0],load:['session-recovery',1],campaign:['campaign-setup',0],deploy:['troop-deployment',0],release:['troop-actions',1],split:['army-panel',3]};if(routes[a]){go(...routes[a]);return;}if(a==='close'){const previous=state.history.pop();if(previous){state.screen=previous.screen;state.variant=previous.variant;render();save();}else toast('Fermeture de la fiche · retour au contexte précédent');return;}if(a==='path'){toast('Trajet prévisualisé · le bouton Déplacer reste accessible.');return;}if(a==='copy'){toast('Code sélectionné · copie simulée dans ce prototype');return;}if(a==='transfer'){toast('Transfert simulé · les troupes identiques fusionnent.');return;}if(a==='choice'||a==='slot'||a==='item'){const group=b.parentElement;for(const other of group.querySelectorAll('button[aria-pressed]'))other.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');return;}if(a==='menuitem'){const text=b.textContent;if(/Grimoire|Magie/.test(text)){go('spellbook',0);return;}if(/voleurs/.test(text)){go('thieves-guild-view',1);return;}if(/recruter/.test(text)){go('creature-presentation',1);return;}if(/Paramètres/.test(text)){go('game-menu',1);return;}}
toast(a==='confirm'?'Aperçu de confirmation · aucune partie modifiée.':'Action « '+b.textContent+' » · prototype');});
render();new ResizeObserver(fit).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addToggle(state,'longText',{label:'Description longue'});tweak.addToggle(state,'maxResources',{label:'Ressources maximales'});tweak.addSelect(state,'evolutions',{label:'Évolutions',options:['3','4']});tweak.addSelect(state,'faction',{label:'Faction du château',options:['Château','Rempart','Tour','Inferno','Nécropole','Donjon','Bastion','Forteresse','Conflux','Goonks']});}
// Local prototype inspection entry; it has no connection to a running game.
root.prototypeGallery={inventory:INVENTORY,state,render,model,labels};
})();
</script>
