<div id="heroes-real-gallery">
 <div class="hr-controls">
  <label>Écran réel<select data-screen aria-label="Écran du jeu"></select></label>
  <label>Format<select data-viewport aria-label="Format de l’écran"><option value="360x640">Portrait · 360 × 640</option><option value="320x568">Portrait · 320 × 568</option><option value="640x360">Paysage · 640 × 360</option><option value="568x280">Paysage · 568 × 280</option></select></label>
 </div>
 <div class="hr-caption"><span data-caption></span><span>Captures du moteur réel · composants du jeu</span></div>
 <div class="viz-carousel viz-dotted-background" aria-label="Habillage des vrais écrans Heroes III" data-previous-label="Précédent" data-next-label="Suivant">
  <section data-variant="Heroes III · proposé"><div class="hr-view"><img data-design="heroes" alt="Écran du vrai jeu avec la proposition Heroes III"></div></section>
  <section data-variant="Jeu actuel" hidden><div class="hr-view"><img data-design="current" alt="Même écran dans le jeu actuel"></div></section>
 </div>
 <div class="hr-legend">Textures, fenêtres, portraits, bâtiments, sorts, valeurs et commandes proviennent du jeu exécuté.</div>
</div>
<style>
 #heroes-real-gallery{font:14px/20px system-ui;color:light-dark(#31251b,#f4e8cf)}
 #heroes-real-gallery *{box-sizing:border-box}
 #heroes-real-gallery .hr-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-right:96px;margin-bottom:12px}
 #heroes-real-gallery label{display:grid;gap:4px;min-width:0}
 #heroes-real-gallery select{min-width:0;width:100%;min-height:48px;padding:8px 12px;font:inherit;border:1px solid #9c7e48;border-radius:0;background:light-dark(#fff8ea,#35281c);color:inherit}
 #heroes-real-gallery .hr-caption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:12px}
 #heroes-real-gallery .hr-view{width:100%;height:660px;display:flex;justify-content:center;align-items:flex-start;padding:8px 0}
 #heroes-real-gallery .hr-view img{display:block;max-width:100%;height:auto;object-fit:contain;background:#251a10;box-shadow:0 2px 12px #0004}
 #heroes-real-gallery .hr-legend{font-size:12px;line-height:18px;margin-top:12px}
 @media(max-width:520px){#heroes-real-gallery .hr-controls{grid-template-columns:1fr}}
</style>
<script>
(()=>{
 const root=document.getElementById('heroes-real-gallery');
 const DATA=__REAL_DATA__,EMBEDDED=__EMBEDDED__,BASE='__ASSET_BASE__';
 const saved=globalThis.openai?.widgetState?.privateContent||{};
 const choices=[...new Map(DATA.samples.map(s=>[s.screen,s.label]))];
 const state={screen:choices.some(([id])=>id===saved.screen)?saved.screen:'blacksmith',viewport:['360x640','320x568','640x360','568x280'].includes(saved.viewport)?saved.viewport:'640x360'};
 const screen=root.querySelector('[data-screen]'),viewport=root.querySelector('[data-viewport]');
 screen.innerHTML=choices.map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('');
 function render(){screen.value=state.screen;viewport.value=state.viewport;const [width,height]=state.viewport.split('x').map(Number);for(const image of root.querySelectorAll('img[data-design]')){const sample=DATA.samples.find(s=>s.screen===state.screen&&s.width===width&&s.height===height&&s.design===image.dataset.design);if(!sample)throw Error('Cette vue n’a pas été capturée dans le moteur.');if(image.dataset.capture!==sample.file){image.src=EMBEDDED[sample.file]||BASE+'/'+sample.file;image.dataset.capture=sample.file;}image.style.width=width+'px';image.alt=sample.label+' · '+(sample.design==='heroes'?'proposition Heroes III':'version actuelle')+' · capture native';image.parentElement.style.height=(Math.min(1,root.clientWidth/width)*height+24)+'px';}root.querySelector('[data-caption]').textContent=screen.selectedOptions[0].textContent+' · '+width+' × '+height;}
 root.addEventListener('change',()=>{state.screen=screen.value;state.viewport=viewport.value;render();globalThis.openai?.setWidgetState?.({modelContent:{realHeroesScreen:state.screen,viewport:state.viewport},privateContent:state})?.catch(()=>{});});
 new ResizeObserver(render).observe(root);render();
 root.realCaptureGallery={data:DATA,state,render};
})();
</script>
