const saved=globalThis.openai?.widgetState?.privateContent||{};
const state={screen:saved.screen||'creature-presentation',variant:saved.variant??1,orientation:saved.orientation||'portrait',size:saved.size||'small',qty:3,unit:0,spell:0,metric:'Armée',longText:false,maxResources:false,evolutions:'4',faction:'Goonks',settingsSection:'Général',toast:'',history:[]};

let toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const btn=(label,kind='secondary',action='confirm',extra='')=>'<button type="button" class="'+kind+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
const cost=(n=2200,resource='gold')=>'<span class="hg-cost"><img src="'+ASSETS[resource]+'" alt="'+({gold:'or',gems:'gemmes',crystal:'cristaux'}[resource]||resource)+'">'+Number(n).toLocaleString('fr-FR').replace(/[\u00a0\u202f]/g,' ')+'</span>';
const art=(n=0,cls='')=>{const r=RECTS[n%RECTS.length];return '<span class="hg-art '+cls+'"><svg viewBox="'+r.x+' '+r.y+' '+r.w+' '+r.h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustration statique de '+esc(r.key)+'"><image href="'+ASSETS.creatures+'" width="1536" height="1024"/></svg></span>';};
const hero=()=>'<span class="hg-art hero"><img src="'+ASSETS.hero+'" alt="Portrait du héros"></span>';
const row=(name,detail='',tail='')=>'<div class="hg-row"><div><strong>'+name+'</strong>'+(detail?'<p>'+detail+'</p>':'')+'</div>'+tail+'</div>';
const card=(title,body)=>'<section class="hg-card"><h2>'+title+'</h2>'+body+'</section>';
const alert=(text,error=false)=>'<div class="hg-alert'+(error?' error':'')+'" role="'+(error?'alert':'status')+'">'+text+'</div>';
const empty=(title,text)=>'<div class="hg-empty">'+icon('inbox')+'<h2>'+title+'</h2><p class="hg-subtle">'+text+'</p></div>';
const field=(label,value,options=null)=>'<label class="hg-field"><span>'+label+'</span>'+(options?'<select aria-label="'+label+'">'+options.map(o=>'<option '+(o===value?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input aria-label="'+label+'" value="'+esc(value)+'">')+'</label>';
const toggle=(label,detail='',checked=true)=>'<label class="hg-switch"><input type="checkbox" '+(checked?'checked':'')+'><span>'+label+(detail?'<small>'+detail+'</small>':'')+'</span></label>';
const radio=(label,checked=false,name='choice')=>'<label class="hg-inline-choice"><input type="radio" name="'+name+'" '+(checked?'checked':'')+'><span>'+label+'</span></label>';
const tabs=(names,selected=0)=>'<div class="hg-tabs" role="tablist">'+names.map((n,i)=>'<button type="button" role="tab" aria-selected="'+(i===selected)+'" data-action="tab" data-tab="'+i+'">'+n+'</button>').join('')+'</div>';
const stats=(side=false)=>'<div class="hg-stats'+(side?' side':'')+'">'+['ATQ','DÉF','DGT','PV','VIT'].map((n,i)=>'<span><small>'+n+'</small><b>'+[29,20,'30–55',300,12][i]+'</b></span>').join('')+'</div>';
const quantity=()=>'<div class="hg-qty">'+btn('−','secondary','less','aria-label="Réduire la quantité"')+'<input type="number" min="1" max="14" value="'+state.qty+'" aria-label="Quantité">'+btn('+','secondary','more','aria-label="Augmenter la quantité"')+btn('Max','secondary','max')+'</div>';
const purchase=()=>'<div class="hg-purchase"><div class="hg-line"><span>14 disponibles</span><small>Unité '+cost(2200)+'</small></div>'+quantity()+'<div class="hg-line"><strong>Total</strong>'+cost(state.qty*2200)+'</div></div>';
const names=['Paingpaing','Picpique','Zinzéclair','Bubu','Bobope','Maillemaille','Chouchou'];
const resources=()=>'<div class="hg-resources" aria-label="Ressources du royaume">'+['wood','mercury','ore','sulfur','crystal','gems','gold','mithril'].map((r,i)=>'<span class="hg-resource" aria-label="'+r+'"><span>'+(ASSETS[r]?'<img src="'+ASSETS[r]+'" alt="'+['bois','mercure','minerai','soufre','cristal','gemmes','or','mithril'][i]+'">':'<span class="mithril">Mi</span>')+'</span><span>'+(state.maxResources?(r==='gold'?'9 999 999':'9999'):[30,10,30,10,10,10,'19 500',0][i])+'</span></span>').join('')+'</div>';
const desc=()=>'<p class="hg-desc">Attaque à distance. Le nuage affaiblit la cible ; son évolution la ralentit aussi.'+(state.longText?' Immunité à la peur. Ignore une partie de la défense adverse. Le bonus de commandement s’applique à toutes les troupes alliées, sauf aux créatures immunisées. Les effets de sorts actifs apparaissent dans la fiche de combat.':'')+'</p>';

case'game-menu':if(v==='Menu')return menu();if(/nouvelle/.test(v))return {body:alert('La partie en cours sera quittée. La dernière sauvegarde reste disponible.',true),primary:'Nouvelle partie',secondary:'Sauvegarder',more:[]};if(/stockage/i.test(v))return storage(v,'storage-page');return settings(v);

const outOfGame=new Set(['hosted-match-create','online-lobby','online-login','lobby-choices','campaign-setup','storage-page','session-recovery','boot-screen','loading','campaign-media','hosted-turn-notifications','wog-options','lobby-options','scenario-filters','hosted-castles','hosted-code-copy','material-select','scenario-details','hosting-index','storage']);
const screenSelect=root.querySelector('[data-gallery=screen]'),stateSelect=root.querySelector('[data-gallery=state]');
screenSelect.innerHTML=INVENTORY.map(s=>'<option value="'+s.id+'">'+labels[s.id]+'</option>').join('');
function save(){globalThis.openai?.setWidgetState?.({modelContent:{prototype:{screen:state.screen,state:INVENTORY.find(s=>s.id===state.screen)?.variants[state.variant],orientation:state.orientation,size:state.size,direction:root.querySelector('[data-variant]:not([hidden])')?.dataset.variant}},privateContent:{screen:state.screen,variant:state.variant,orientation:state.orientation,size:state.size}})?.catch(()=>{});}
function fit(){const landscape=state.orientation==='landscape',w=landscape?(state.size==='tight'?568:640):(state.size==='tight'?320:360),h=landscape?(state.size==='tight'?280:360):(state.size==='tight'?568:640);for(const device of root.querySelectorAll('.hg-device')){const stage=device.parentElement,scale=Math.min(1,((stage.clientWidth||root.clientWidth)-2)/w);device.style.width=w+'px';device.style.height=h+'px';device.style.transform='scale('+scale+')';stage.style.height=(h*scale+24)+'px';device.classList.toggle('landscape',landscape);}const scale=Math.min(1,(root.clientWidth-2)/w);root.querySelector('[data-dimensions]').textContent=w+' × '+h+' px'+(scale<.99?' · aperçu '+Math.round(scale*100)+' %':'');}
function render(){const screen=INVENTORY.find(s=>s.id===state.screen);state.variant=Math.min(state.variant,screen.variants.length-1);const v=screen.variants[state.variant];screenSelect.value=state.screen;stateSelect.innerHTML=screen.variants.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');stateSelect.value=String(state.variant);root.querySelector('[data-gallery=orientation]').value=state.orientation;root.querySelector('[data-gallery=size]').value=state.size;root.querySelector('[data-coverage]').textContent='56 familles · 175 états · '+labels[screen.id];for(const device of root.querySelectorAll('.hg-device')){const m=model(screen,v,device.dataset.design),showResources=!outOfGame.has(screen.id)&&!(screen.id==='mobile'&&['Accueil','Multijoueur','Préparer la partie','Charger une partie','Catalogue des campagnes'].includes(v)),title=m.title||shortTitles[screen.id]||labels[screen.id];device.innerHTML='<div class="hg-shell"><header class="hg-top"><div class="hg-title"><h1>'+title+'</h1>'+(state.orientation==='landscape'&&(m.more?.length||m.secondary)?btn(icon('ellipsis'),'quiet','menu','aria-label="Autres actions"'):'')+btn(icon('x'),'quiet','close','aria-label="Fermer cet écran"')+'</div>'+(showResources?resources():'')+'</header><main class="hg-content'+(m.scene?' scene':m.hall?' hall':m.guild?' guild':m.hero?' hero':m.armies?' armies':'')+'" aria-label="'+esc(v)+'">'+(m.note?alert(m.note):'')+m.body+'</main><footer class="hg-dock">'+(m.context?'<div class="hg-context">'+m.context+'</div>':'')+'<div class="hg-dock-actions">'+(m.secondary&&state.orientation!=='landscape'?btn(m.secondary,'secondary','secondary'):'')+(m.primary?btn(m.primary,'primary','confirm',m.disabled?'disabled':''):'')+(state.orientation!=='landscape'&&m.more?.length?btn(icon('ellipsis'),'quiet','menu','aria-label="Autres actions"'):'')+'</div></footer></div>'+(state.toast?'<div class="hg-toast" role="status">'+esc(state.toast)+'</div>':'');device.dataset.family=screen.id;device.dataset.variant=v;device.dataset.primary=m.primary||'';device._menu=[...(m.more||[]),...(m.secondary&&state.orientation==='landscape'?[m.secondary]:[])];}
fit();globalThis.lucide?.createIcons?.({attrs:{width:20,height:20}});}
function go(id,variant=0){state.history.push({screen:state.screen,variant:state.variant});state.screen=id;state.variant=variant;state.toast='';render();save();}
function toast(text){clearTimeout(toastTimer);state.toast=text;for(const d of root.querySelectorAll('.hg-device')){d.querySelector('.hg-toast')?.remove();d.querySelector('.hg-popover')?.remove();const n=document.createElement('div');n.className='hg-toast';n.setAttribute('role','status');n.textContent=text;d.append(n);}toastTimer=setTimeout(()=>{state.toast='';for(const n of root.querySelectorAll('.hg-toast'))n.remove();},2500);}
root.addEventListener('change',event=>{const g=event.target.dataset.gallery;if(g){if(g==='screen'){state.screen=event.target.value;state.variant=0;}else if(g==='state')state.variant=Number(event.target.value);else state[g]=event.target.value;render();save();}else if(event.target.matches('.hg-qty input')){state.qty=Math.max(1,Math.min(14,Number(event.target.value)||1));render();}else if(event.target.getAttribute('aria-label')==='Vue du héros'){state.variant=event.target.selectedIndex;render();}else if(event.target.getAttribute('aria-label')==='Rubrique'){state.settingsSection=event.target.value;render();}else if(event.target.getAttribute('aria-label')==='Évolution'){state.unit=event.target.selectedIndex;render();}else if(event.target.getAttribute('aria-label')==='Faction'){state.faction=event.target.value;render();}else if(event.target.getAttribute('aria-label')==='Renseignement'){state.metric=event.target.value;render();}});

ccessible.');return;}if(a==='copy'){toast('Code sélectionné · copie simulée dans ce prototype');return;}if(a==='transfer'){toast('Transfert simulé · les troupes identiques fusionnent.');return;}if(a==='choice'||a==='slot'||a==='item'){const group=b.parentElement;for(const other of group.querySelectorAll('button[aria-pressed]'))other.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');return;}if(a==='menuitem'){const text=b.textContent;if(/Grimoire|Magie/.test(text)){go('spellbook',0);return;}if(/voleurs/.test(text)){go('thieves-guild-view',1);return;}if(/recruter/.test(text)){go('creature-presentation',1);return;}if(/Paramètres/.test(text)){go('game-menu',1);return;}}
toast(a==='confirm'?'Aperçu de confirmation · aucune partie modifiée.':'Action « '+b.textContent+' » · prototype');});
render();new ResizeObserver(fit).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addToggle(state,'longText',{label:'Description longue'});tweak.addToggle(state,'maxResources',{label:'Ressources maximales'});tweak.addSelect(state,'evolutions',{label:'Évolutions',options:['3','4']});tweak.addSelect(state,'faction',{label:'Faction du château',options:['Château','Rempart','Tour','Inferno','Nécropole','Donjon','Bastion','Forteresse','Conflux','Goonks']});}
// Local prototype inspection entry; it has no connection to a running game.
root.prototypeGallery={inventory:INVENTORY,state,render,model,labels};
})();
