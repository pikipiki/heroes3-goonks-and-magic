name: Publish Heroes Goonk to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Test and build the public game
        env:
          GOONK_LOBBY_RELAY: ${{ vars.GOONK_LOBBY_RELAY }}
          GOONK_HOSTED_POOL_ENDPOINT: ${{ vars.GOONK_HOSTED_POOL_ENDPOINT }}
          GOONK_HOSTED_ENDPOINT: ${{ vars.GOONK_HOSTED_ENDPOINT }}
          GOONK_PUSH_PUBLIC_KEY: ${{ vars.GOONK_PUSH_PUBLIC_KEY }}
        run: npm test && npm run prepare:web && npm run build:web && npm run verify:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
